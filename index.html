<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoClip Workspace — 9:16 Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgmain: '#090d16',
            card: '#111827',
            card2: '#182235'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bgmain text-slate-100 min-h-screen antialiased">
  <header class="border-b border-slate-800 bg-card/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400 text-slate-950 font-extrabold flex items-center justify-center shrink-0">
          AC
        </div>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <span class="font-bold text-white truncate">AutoClip Project Studio</span>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">
              1080×1920
            </span>
          </div>
          <p class="text-xs text-slate-400 truncate">Kelola klip, hook, dan pemicu GitHub Actions</p>
        </div>
      </div>

      <div class="text-xs px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
        Total Klip: <strong id="clipCount" class="text-cyan-300">0</strong>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-7 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <section class="lg:col-span-5 space-y-6">
      <div class="rounded-2xl bg-card border border-slate-800 p-5 space-y-4">
        <h2 class="text-base font-bold text-white">1. Konfigurasi Sumber & GitHub</h2>

        <div>
          <label for="srcUrl" class="block text-xs font-medium text-slate-400 mb-1">URL Video Sumber</label>
          <input
            id="srcUrl"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
            class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-400"
          />
        </div>

        <details class="rounded-xl bg-slate-950/70 border border-slate-800 p-3.5">
          <summary class="cursor-pointer text-xs font-semibold text-slate-200 select-none">
            Pengaturan Repository & PAT (Opsional)
          </summary>
          <div class="mt-3 grid grid-cols-2 gap-2.5 text-xs">
            <div>
              <label for="ghOwner" class="block text-slate-400 mb-1">Owner</label>
              <input id="ghOwner" type="text" placeholder="username" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-2.5 py-1.5 text-white" />
            </div>
            <div>
              <label for="ghRepo" class="block text-slate-400 mb-1">Repo</label>
              <input id="ghRepo" type="text" value="Autoclip" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-2.5 py-1.5 text-white" />
            </div>
            <div>
              <label for="ghWorkflow" class="block text-slate-400 mb-1">Workflow File</label>
              <input id="ghWorkflow" type="text" value="autoclip.yml" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-2.5 py-1.5 text-white" />
            </div>
            <div>
              <label for="ghToken" class="block text-slate-400 mb-1">GitHub PAT</label>
              <input id="ghToken" type="password" placeholder="github_pat_..." class="w-full rounded-lg bg-slate-900 border border-slate-700 px-2.5 py-1.5 text-white" />
            </div>
          </div>
        </details>
      </div>

      <form id="addClipForm" class="rounded-2xl bg-card border border-slate-800 p-5 space-y-4">
        <h2 class="text-base font-bold text-white">2. Tambah Segmen Klip</h2>

        <div>
          <label for="clipTitle" class="block text-xs font-medium text-slate-400 mb-1">Judul Klip</label>
          <input
            id="clipTitle"
            type="text"
            required
            placeholder="Contoh: Momen paling seru"
            class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-400"
          />
        </div>

        <div>
          <label for="hookText" class="block text-xs font-medium text-slate-400 mb-1">Teks Hook Awal (5 detik pertama, opsional)</label>
          <input
            id="hookText"
            type="text"
            placeholder="Contoh: WAJIB NONTON SAMPAI HABIS!"
            class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-400"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="startSec" class="block text-xs font-medium text-slate-400 mb-1">Mulai (detik)</label>
            <input id="startSec" type="number" min="0" value="15" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white" />
          </div>
          <div>
            <label for="durationSec" class="block text-xs font-medium text-slate-400 mb-1">Durasi (detik)</label>
            <input id="durationSec" type="number" min="1" max="600" value="45" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white" />
          </div>
        </div>

        <button
          type="submit"
          class="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 hover:opacity-95 text-slate-950 font-bold text-sm py-2.5 transition cursor-pointer"
        >
          + Simpan Klip ke Daftar
        </button>
      </form>
    </section>

    <section class="lg:col-span-7 rounded-2xl bg-card border border-slate-800 p-5 sm:p-6 space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-lg font-bold text-white">Daftar Klip Proyek</h2>
          <p class="text-xs text-slate-400">Jalankan langsung ke GitHub Actions atau salin perintah CLI.</p>
        </div>
        <button id="clearAllBtn" type="button" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-rose-950/60 border border-slate-700 text-xs font-medium text-rose-300 cursor-pointer">
          Reset Daftar
        </button>
      </div>

      <div id="clipsContainer" class="space-y-3"></div>

      <div id="outputBox" class="hidden rounded-xl bg-slate-950 border border-slate-800 p-4 space-y-2">
        <div id="outputLabel" class="text-xs font-semibold text-cyan-300"></div>
        <pre id="outputContent" class="text-xs font-mono text-slate-300 overflow-x-auto whitespace-pre-wrap"></pre>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'autoclip_studio_items_v1';
    const clipsContainer = document.getElementById('clipsContainer');
    const clipCount = document.getElementById('clipCount');
    const addClipForm = document.getElementById('addClipForm');
    const outputBox = document.getElementById('outputBox');
    const outputLabel = document.getElementById('outputLabel');
    const outputContent = document.getElementById('outputContent');
    const clearAllBtn = document.getElementById('clearAllBtn');

    function loadClips() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveClips(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      renderClips();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&', '<': '<', '>': '>', '"': '"', "'": '''
      }[m]));
    }

    function showOutput(title, text, colorClass = 'text-cyan-300') {
      outputBox.classList.remove('hidden');
      outputLabel.className = `text-xs font-semibold ${colorClass}`;
      outputLabel.textContent = title;
      outputContent.textContent = text;
    }

    function renderClips() {
      const clips = loadClips();
      clipCount.textContent = String(clips.length);

      if (!clips.length) {
        clipsContainer.innerHTML = `
          <div class="rounded-xl bg-slate-950/70 border border-dashed border-slate-800 p-8 text-center text-sm text-slate-500">
            Belum ada klip. Tambahkan klip di panel sebelah kiri.
          </div>`;
        return;
      }

      clipsContainer.innerHTML = clips.map((c, idx) => {
        const endSec = Number(c.start) + Number(c.duration);
        return `
          <article class="rounded-xl bg-card2 border border-slate-800 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 text-[11px]">
                <span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-semibold">#${idx + 1}</span>
                <span class="text-cyan-300 font-mono">${c.start}s → ${endSec}s (${c.duration}s)</span>
                ${c.hook ? `<span class="text-amber-300">• Hook: "${escapeHtml(c.hook)}"</span>` : ''}
              </div>
              <h3 class="text-sm font-bold text-white truncate">${escapeHtml(c.title)}</h3>
              <p class="text-xs text-slate-400 truncate">${escapeHtml(c.url || 'URL kosong')}</p>
            </div>

            <div class="flex flex-wrap items-center gap-2 shrink-0">
              <button
                type="button"
                onclick="triggerClip(${idx})"
                class="px-3 py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-slate-950 font-bold text-xs cursor-pointer"
              >
                Run Action
              </button>
              <button
                type="button"
                onclick="copyCli(${idx})"
                class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs text-slate-200 cursor-pointer"
              >
                CLI
              </button>
              <button
                type="button"
                onclick="removeClip(${idx})"
                class="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-rose-950/60 border border-slate-700 text-xs text-rose-300 cursor-pointer"
              >
                Hapus
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    window.removeClip = function(idx) {
      const clips = loadClips();
      clips.splice(idx, 1);
      saveClips(clips);
    };

    window.copyCli = async function(idx) {
      const c = loadClips()[idx];
      if (!c) return;
      const wf = document.getElementById('ghWorkflow').value.trim() || 'autoclip.yml';
      const cmd = `gh workflow run ${wf} -f video_url="${c.url}" -f mulai_detik="${c.start}" -f durasi="${c.duration}" -f hook_text="${c.hook || ''}"`;
      try {
        await navigator.clipboard.writeText(cmd);
        showOutput('Perintah CLI disalin ke clipboard:', cmd, 'text-emerald-400');
      } catch {
        showOutput('Salin perintah CLI berikut:', cmd);
      }
    };

    window.triggerClip = async function(idx) {
      const c = loadClips()[idx];
      if (!c) return;
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const wf = document.getElementById('ghWorkflow').value.trim() || 'autoclip.yml';
      const token = document.getElementById('ghToken').value.trim();

      const payload = {
        ref: 'main',
        inputs: {
          video_url: String(c.url || ''),
          mulai_detik: String(c.start),
          durasi: String(c.duration),
          hook_text: String(c.hook || '')
        }
      };

      if (!owner || !repo || !token) {
        showOutput(
          'Lengkapi Owner, Repo, & PAT untuk memicu langsung, atau jalankan CLI ini:',
          `gh workflow run ${wf} -f video_url="${c.url}" -f mulai_detik="${c.start}" -f durasi="${c.duration}" -f hook_text="${c.hook || ''}"`,
          'text-amber-300'
        );
        return;
      }

      showOutput('Mengirim workflow_dispatch ke GitHub...', JSON.stringify(payload, null, 2));

      try {
        const res = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/actions/workflows/${encodeURIComponent(wf)}/dispatches`,
          {
            method: 'POST',
            headers: {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          }
        );

        if (res.status === 204) {
          showOutput('Berhasil dipicu! Cek tab Actions di repository GitHub Anda.', JSON.stringify(payload, null, 2), 'text-emerald-400');
        } else {
          const errJson = await res.json().catch(() => ({}));
          showOutput(`Gagal memicu workflow (HTTP ${res.status}): ${errJson.message || 'Periksa token & nama workflow'}`, JSON.stringify(payload, null, 2), 'text-rose-400');
        }
      } catch (err) {
        showOutput(`Error jaringan: ${err.message}`, '', 'text-rose-400');
      }
    };

    addClipForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const url = document.getElementById('srcUrl').value.trim();
      const title = document.getElementById('clipTitle').value.trim();
      const hook = document.getElementById('hookText').value.trim();
      const start = Math.max(0, parseInt(document.getElementById('startSec').value || '15', 10));
      const duration = Math.max(1, parseInt(document.getElementById('durationSec').value || '45', 10));

      const clips = loadClips();
      clips.unshift({ url, title, hook, start, duration });
      saveClips(clips);

      document.getElementById('clipTitle').value = '';
      document.getElementById('hookText').value = '';
    });

    clearAllBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      renderClips();
      outputBox.classList.add('hidden');
    });

    renderClips();
  </script>
</body>
</html>
